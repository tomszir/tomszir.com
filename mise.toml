[tools]
node = "24"
pnpm = "12.16.1"

[tasks.check]
description = "Type-check, lint, build, and check the built output"
run = ["pnpm astro check", "pnpm biome check .", "pnpm build"]

[tasks."icons:vendor"]
description = "Re-vendor pinned icons from vendor/icons.lock.json"
run = "node scripts/vendor-icons.mjs"

[tasks."fonts:vendor"]
description = "Re-vendor and subset the pinned fonts from vendor/fonts.lock.json"
run = "node scripts/vendor-fonts.mjs"
